<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="Talkdedsec — a code editor with no telemetry">
<title>Talkdedsec</title>
<style>
  .rise{opacity:0;animation:rise .7s cubic-bezier(.22,1,.36,1) both}
  .rule{transform-box:fill-box;transform-origin:left center;animation:draw .9s cubic-bezier(.22,1,.36,1) .35s both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){.rise,.rule{animation:none;opacity:1;transform:none}}
</style>
<rect width="1280" height="380" fill="#0b0b0c"/>
<rect x="0.5" y="0.5" width="1279" height="379" fill="none" stroke="#232428"/>

<text class="rise" x="72" y="84" font-family="ui-monospace,'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16" letter-spacing="6" fill="#8f959e">TALKDEDSEC</text>
<text class="rise" style="animation-delay:.08s" x="68" y="206" font-family="'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="116" font-weight="700" letter-spacing="-4" fill="#f2f3f5">Code editor.</text>
<text class="rise" style="animation-delay:.18s" x="72" y="262" font-family="'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="33" font-weight="500" fill="#c9cdd4">No telemetry. Nothing you did not install.</text>

<line class="rule" x1="72" y1="298" x2="1208" y2="298" stroke="#232428"/>

<g font-family="ui-monospace,'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace">
  <text class="rise" style="animation-delay:.55s" x="72"  y="342" font-size="30" font-weight="600" fill="#f2f3f5">0.41<tspan font-size="17" fill="#8f959e"> S COLD START</tspan></text>
  <text class="rise" style="animation-delay:.65s" x="400" y="342" font-size="30" font-weight="600" fill="#f2f3f5">9<tspan font-size="17" fill="#8f959e"> PROCESSES</tspan></text>
  <text class="rise" style="animation-delay:.75s" x="650" y="342" font-size="30" font-weight="600" fill="#f2f3f5">64<tspan font-size="17" fill="#8f959e"> EXTENSIONS</tspan></text>
  <text class="rise" style="animation-delay:.85s" x="900" y="342" font-size="30" font-weight="600" fill="#f2f3f5">0<tspan font-size="17" fill="#8f959e"> TELEMETRY</tspan></text>
  <text class="rise" style="animation-delay:.95s" x="1208" y="342" text-anchor="end" font-size="17" fill="#8f959e">WINDOWS x64 · v1.130.0</text>
</g>
</svg>
